<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081120"/>
      <stop offset="50%" stop-color="#0f213e"/>
      <stop offset="100%" stop-color="#061226"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners for splash -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle tech border -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="4"/>
  
  <!-- Tropical Sea Waves Motif in background -->
  <path d="M 60 380 Q 140 350 220 380 T 380 380 T 450 380" fill="none" stroke="#0284c7" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round"/>
  <path d="M 80 410 Q 160 380 240 410 T 400 410 T 440 410" fill="none" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="6" stroke-linecap="round"/>

  <!-- Sun / Compass Ring Glow -->
  <circle cx="256" cy="220" r="140" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="16 10" filter="url(#glow)" opacity="0.6"/>

  <!-- Stylized KAYAN Monogram Crest: Hexagonal badge with 'K' -->
  <polygon points="256,110 355,165 355,275 256,330 157,275 157,165" fill="#0b1e3b" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Dynamic 'K' Lettermark -->
  <path d="M 215 155 L 215 285" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <path d="M 298 160 L 218 220 L 302 280" stroke="url(#cyanGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Tropical Palm & Sun Sparkle -->
  <circle cx="355" cy="165" r="12" fill="url(#goldGrad)" filter="url(#glow)"/>
  
  <!-- Text: KAYAN SOKHNA -->
  <text x="256" y="445" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">KAYAN TRIP</text>
  <text x="256" y="475" font-family="-apple-system, sans-serif" font-size="18" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="2">رحلة العين السخنة</text>
</svg>
